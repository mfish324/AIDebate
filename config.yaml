# Multi-AI Debate System Configuration

providers:
  claude:
    enabled: true
    model: claude-sonnet-4-20250514
    max_tokens: 1000
    temperature: 0.7

  openai:
    enabled: true
    model: gpt-4o
    max_tokens: 1000
    temperature: 0.7

  groq:
    enabled: true
    model: llama-3.3-70b-versatile
    max_tokens: 1000
    temperature: 0.7

# Debate settings
debate:
  timeout: 30  # seconds per API call
  max_retries: 3
  retry_delay: 1  # base delay for exponential backoff

# Output settings
output:
  directory: debates
  formats:
    - md
    - json
  verbose: false

# Cost tracking (approximate costs per 1K tokens)
costs:
  claude:
    input: 0.003
    output: 0.015
  openai:
    input: 0.005
    output: 0.015
  groq:
    input: 0.00059
    output: 0.00079
  warning_threshold: 1.00  # USD
