# Multi-AI Debate System Configuration

providers:
  claude:
    enabled: true
    model: claude-sonnet-4-6
    max_tokens: 1000
    temperature: 0.7

  openai:
    enabled: true
    model: gpt-4.1
    max_tokens: 1000
    temperature: 0.7

  gemini:
    enabled: true
    model: gemini-2.5-flash
    max_tokens: 1000
    temperature: 0.7

  groq:
    enabled: true
    model: llama-4-scout-17b-16e-instruct
    max_tokens: 1000
    temperature: 0.7

# Debate settings
debate:
  timeout: 30  # seconds per API call
  max_retries: 3
  retry_delay: 1  # base delay for exponential backoff

# Output settings
output:
  directory: debates
  formats:
    - md
    - json
  verbose: false

# Cost tracking (approximate costs per 1K tokens)
costs:
  claude:
    input: 0.003
    output: 0.015
  openai:
    input: 0.002
    output: 0.008
  gemini:
    input: 0.00015
    output: 0.0006
  groq:
    input: 0.00059
    output: 0.00079
  warning_threshold: 1.00  # USD
